name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare official wallpaper sync
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check --timeout 15 'Pillow==13.0.0'
      - name: Check official wallpaper downloads
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/update-official-gallery.py --max-new 6 --seconds 150
      - name: Keep new official covers in the repository
        continue-on-error: true
        shell: bash
        run: |
          git add -- public/data/hero-gallery.json public/assets/hero-gallery
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh official JOGUMAN covers [skip ci]'
            # GITHUB_TOKEN pushes do not recursively start this workflow. Never
            # force-push over an article uploaded while the wallpaper check ran.
            if ! git push origin HEAD:main; then
              echo '::warning::New covers are included in this deployment, but could not be saved to main. The next publish will check them again; no existing commit was overwritten.'
            fi
          fi
      - name: Check and build the static blog
        run: node scripts/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
